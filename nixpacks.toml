[phases.setup]
# nodejs is yt-dlp's JavaScript runtime for YouTube's signature/n-parameter
# challenges. yt-dlp requires Node >= 22; Debian/nixpacks' default is older.
aptPkgs = ["ffmpeg"]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_22"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python -m music_bot.main"
